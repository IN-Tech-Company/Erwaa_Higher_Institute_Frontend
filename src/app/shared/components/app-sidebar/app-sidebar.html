<div class="asb-backdrop"
     [class.asb-backdrop--visible]="show()"
     (click)="close.emit()"></div>

<aside class="asb-panel"
       [class.asb-panel--open]="show()">
  @if (title()) {
  <div class="asb-header">
    <h2 class="asb-title">{{ title() }}</h2>
    <button class="asb-close"
            type="button"
            (click)="close.emit()">
      <i class="bx bx-x"></i>
    </button>
  </div>
  }
  <div class="asb-body">
    <ng-content />
  </div>
</aside>
