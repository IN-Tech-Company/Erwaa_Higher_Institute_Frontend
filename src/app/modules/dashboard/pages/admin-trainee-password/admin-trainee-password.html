<section class="dash-page">
  <a class="dash-page__back"
     [routerLink]="['/', lang(), 'app', 'admin', 'trainees', id]">
    <span class="material-symbols-outlined icon-flip-rtl">arrow_back</span>
    {{ 'ADMIN_TRAINEES.BACK_TO_TRAINEE' | translate }}
  </a>

  <h1 class="dash-page__title"
      data-aos="fade-up">{{ 'ADMIN_TRAINEES.PASSWORD_TITLE' | translate }}</h1>

  <div class="dash-card dash-card--padded dash-card--narrow"
       data-aos="fade-up"
       data-aos-delay="80">
    @if (store.trainee(); as trainee) {
    <app-trainee-password-form [trainee]="trainee" />
    } @else if (store.traineeError(); as error) {
    <div class="dash-state dash-state--error"
         role="alert">
      <span class="material-symbols-outlined">person_off</span>
      <p>{{ error | translate }}</p>
    </div>
    } @else {
    <div class="dash-state">
      <span class="dash-spinner"
            aria-hidden="true"></span>
      <p>{{ 'COMMON.LOADING' | translate }}</p>
    </div>
    }
  </div>
</section>
