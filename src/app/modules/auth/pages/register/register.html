<div class="register">
  <header class="register__intro"
          data-aos="fade-up">
    <h1 class="register__title">{{ 'AUTH.REGISTER.TRAINEE_TITLE' | translate }}</h1>
    <p class="register__switch">
      {{ 'AUTH.REGISTER.HAVE_ACCOUNT' | translate }}
      <a [routerLink]="['/', lang(), 'auth', 'login']">{{ 'AUTH.REGISTER.LOGIN' | translate }}</a>
    </p>
    <p class="register__desc">{{ 'AUTH.REGISTER.TRAINEE_DESC' | translate }}</p>
  </header>

  <app-register-form data-aos="fade-up"
                     data-aos-delay="80" />

  <p class="register__teacher-link">
    {{ 'AUTH.REGISTER.TEACHER_PROMPT' | translate }}
    <a [routerLink]="['/', lang(), 'auth', 'register-teacher']">{{ 'AUTH.REGISTER.TEACHER_CTA' | translate }}</a>
  </p>
</div>
